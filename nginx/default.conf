# Static file server for the crafting site. Only reachable inside the nginx-proxy network;
# TLS and the Keycloak login (oauth2-proxy, container wow-auth) sit in front of it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Per-user state. The X-Forwarded-User/-Groups headers from oauth2-proxy pass through unchanged.
    location /api/ {
        proxy_pass http://wow-api:3000;
        proxy_http_version 1.1;
        client_max_body_size 300k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the page itself so a redeploy shows up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
