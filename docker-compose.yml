# Crafting site ("Forever Werkbank") at https://wow.kuckelsberg.de behind a Keycloak login.
# Pattern: same as /home/luna/srv/spoolman and /home/luna/srv/luna-docs (oauth2-proxy in front).
# Keycloak: realm kuckelsberg, confidential client "wow". Secrets in .env (jupiter only).

services:
  wow-web:
    build: .
    image: crafting-site:local
    container_name: wow-web
    restart: unless-stopped
    networks:
      - nginx-proxy

  wow-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: wow-auth
    restart: unless-stopped
    command: ["--trusted-proxy-ip=172.20.0.0/16"]
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://auth.kuckelsberg.de/realms/kuckelsberg
      - OAUTH2_PROXY_CLIENT_ID=wow
      - OAUTH2_PROXY_CLIENT_SECRET=${WOW_CLIENT_SECRET:?set WOW_CLIENT_SECRET in .env}
      - OAUTH2_PROXY_COOKIE_SECRET=${WOW_COOKIE_SECRET:?set WOW_COOKIE_SECRET in .env}
      - OAUTH2_PROXY_UPSTREAMS=http://wow-web:80
      - OAUTH2_PROXY_REDIRECT_URL=https://wow.kuckelsberg.de/oauth2/callback
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      - VIRTUAL_HOST=wow.kuckelsberg.de
      - VIRTUAL_PORT=4180
      - LETSENCRYPT_HOST=wow.kuckelsberg.de
      - LETSENCRYPT_EMAIL=patrick@kuckelsberg.de
      - NETWORK_ACCESS=external
    networks:
      - nginx-proxy
    depends_on:
      wow-web:
        condition: service_healthy

networks:
  nginx-proxy:
    external: true
