# LOCAL DEVELOPMENT ONLY: stands in for oauth2-proxy and injects user headers.
# The user comes from the cookie "devuser" (default "dev"), so two users can be tested side by side:
#   document.cookie = "devuser=friend"
map $cookie_devuser $dev_user { default $cookie_devuser; "" dev; }
server {
    listen 80;
    location / {
        proxy_pass http://wow-web:80;
        proxy_set_header X-Forwarded-User "sub-$dev_user";
        proxy_set_header X-Forwarded-Preferred-Username $dev_user;
        proxy_set_header X-Forwarded-Email "$dev_user@example.test";
        proxy_set_header X-Forwarded-Groups "/gamers";
    }
}
